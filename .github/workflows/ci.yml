name: CI

# Runs the baseline quality gates on every push to main and every pull
# request. Keeps the branch green between releases — publish.yml runs
# the same checks pre-publish as a belt-and-braces guard, but the gate
# that catches problems early is this workflow.
#
# The test job runs a PostgreSQL x Python x Django matrix (ROADMAP 0.5)
# so the support surface is exercised before 1.0 commits to it. Support
# policy: the current Django LTS lines plus the latest feature release
# (today: 4.2 LTS, 5.2 LTS, 6.0). The matrix is a diagonal arranged so
# every Postgres version (13-17), every supported Python (3.11-3.14) and
# every supported Django is covered with a valid combination — Django 4.2
# tops out at Python 3.12 and Django 6.0 requires Python 3.12+, so the
# old-Python cells run 4.2/5.2 and the 3.14 cell runs 6.0. The typecheck
# and lint jobs stay single-cell: the pyrefly gate is pinned to Python
# 3.11 and ruff is version-independent.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: pyrefly (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
          # Distinct suffix per job so the three CI jobs don't race each
          # other on cache save. Without this they all derive the same
          # key (no uv.lock present) and two of three lose the race.
          cache-suffix: typecheck

      - name: Set up Python 3.11
        run: uv python install 3.11

      # The pyrefly gate covers the whole shipped package, so every
      # optional integration's imports have to resolve — django,
      # sqlalchemy and observability all get installed here. Missing one
      # would turn its module into unresolved imports rather than a
      # checked surface, which is exactly what py.typed promises we do.
      - name: Install typecheck dependencies
        run: |
          uv sync --python 3.11 \
            --extra typecheck \
            --extra django \
            --extra sqlalchemy \
            --extra observability

      # --output-format github emits GitHub Actions annotation lines so
      # failures show up inline in the PR diff, not buried in the job log.
      # --min-severity warn promotes warnings into the reported set, so a
      # new warning fails the job the same way an error does (the gate the
      # old ty config expressed as error-on-warning).
      # --no-sync + --python 3.11 reuses the venv from the previous step;
      # without them uv defaults to the latest Python satisfying
      # requires-python (3.13) and re-syncs without the typecheck extra,
      # which removes `pyrefly` and breaks the run.
      - name: Run pyrefly
        run: |
          uv run --no-sync --python 3.11 \
            pyrefly check --min-severity warn --output-format github

  test:
    name: Tests (PG ${{ matrix.pg }}, Py ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      # Run every cell to completion even if one fails — a regression on
      # one version shouldn't mask the state of the others.
      fail-fast: false
      matrix:
        # Diagonal across the support surface: every Postgres version
        # (13-17), every supported Python (3.11-3.14) and every supported
        # Django (4.2, 5.2, 6.0) covered with a valid pairing. Django 4.2
        # supports Python <=3.12; Django 6.0 requires Python >=3.12. First
        # cell is the floor (oldest everything), last is the ceiling
        # (newest everything).
        include:
          - { pg: "13", python: "3.11", django: "4.2" }
          - { pg: "14", python: "3.12", django: "4.2" }
          - { pg: "15", python: "3.12", django: "5.2" }
          - { pg: "16", python: "3.13", django: "5.2" }
          - { pg: "17", python: "3.13", django: "6.0" }
          - { pg: "17", python: "3.14", django: "6.0" }
    env:
      # The integration / benchmark conftests read this to choose the
      # testcontainers Postgres image (default postgres:16-alpine). Set
      # via env: rather than inline ${{ }} so the matrix value never
      # reaches a shell as code.
      AUDITRUM_TEST_PG_IMAGE: postgres:${{ matrix.pg }}-alpine
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
          # Distinct suffix per cell so cells don't race on cache save
          # (same reason as the typecheck job's suffix).
          cache-suffix: test-py${{ matrix.python }}-dj${{ matrix.django }}-pg${{ matrix.pg }}

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install all extras
        run: |
          uv sync --python ${{ matrix.python }} \
            --extra django \
            --extra sqlalchemy \
            --extra observability \
            --extra test

      # uv.lock pins a single Django; override it to the cell's LTS line.
      # Runs after sync so the rest of the locked environment is intact.
      - name: Pin Django ${{ matrix.django }}
        run: uv pip install --python ${{ matrix.python }} "Django==${{ matrix.django }}.*"

      # Coverage floor lives in .coveragerc (fail_under=80). Raise as
      # gaps close per ROADMAP 0.4 — the gate fails the job if we drop
      # below the floor, which is what we want between releases.
      # --no-sync reuses the venv from the previous steps; without it
      # uv re-syncs from the lock and undoes the Django pin (and drops
      # the test extras, same failure mode as the typecheck job).
      - name: Run tests with coverage
        run: uv run --no-sync --python ${{ matrix.python }} pytest tests/ -q --no-header --cov --cov-report=term

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          # No cache for the lint job — it runs `uvx ruff` in isolation
          # and doesn't touch the project's uv environment, so caching
          # only adds noise (and was the third racer on the same key).
          enable-cache: false

      # Pinning the ruff minor keeps formatter output reproducible across
      # contributor machines without wiring ruff into pyproject.toml's
      # dependency graph.
      - name: Ruff check
        run: uvx ruff@0.15 check .

      # The tree was brought fully under `ruff format` in the 0.5.x typing
      # pass; this step keeps it that way. It runs after the lint step and
      # is not `if: always()` on purpose — a lint failure is the more
      # actionable signal, and formatting drift is trivially fixed by
      # running `uvx ruff@0.15 format .` locally.
      - name: Ruff format check
        run: uvx ruff@0.15 format --check .
