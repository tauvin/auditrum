[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditrum"
version = "0.5.1"
description = "Auditrum — a PostgreSQL audit system with rich contextual logging and Django integration"
readme = "README.md"
authors = [
    {name = "Andrei Karbanovich", email = "andrey.karbanovich@icloud.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

keywords = ["postgresql", "audit", "django", "database", "triggers", "history", "track changes"]

# Core dependencies (for CLI and audit logic)
dependencies = [
    "typer>=0.9",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
django = [
    "Django>=4.2",
]
sqlalchemy = [
    "SQLAlchemy>=2.0",
]
observability = [
    "opentelemetry-api>=1.20",
    "prometheus-client>=0.17",
    "sentry-sdk>=1.30",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.5",
    "testcontainers[postgres]>=4.0",
    "hypothesis>=6.100",
    "pglast>=6.0",
]
benchmark = [
    "pytest-benchmark>=4.0",
    "testcontainers[postgres]>=4.0",
    "psycopg[binary]>=3.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
typecheck = [
    "pyrefly==1.2.0",
    "django-stubs>=5.0,<6",
    "types-python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/tauvin/auditrum"
BugTracker = "https://github.com/tauvin/auditrum/issues"
Documentation = "https://auditrum.readthedocs.io/"

[project.scripts]
auditrum = "auditrum.cli:app"

[tool.setuptools.packages.find]
include = ["auditrum*"]
# Benchmark + test code stays out of the wheel. Users who run the
# benchmarks work from a checkout, not a pip install.
exclude = ["benchmarks*", "tests*"]

[tool.setuptools.package-data]
# ``py.typed`` (PEP 561) tells downstream type checkers that the inline
# annotations in this package are authoritative. It must ship in the wheel
# or the marker has no effect for installed users.
auditrum = ["py.typed", "**/*.html", "**/*.txt", "**/*.sql"]

# ---------------------------------------------------------------------------
# Tooling config. Consolidated here from the previous ruff.toml / pyrefly.toml
# / pytest.ini / .coveragerc at the 0.7 RC prep (single source of truth).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyrefly]
# The whole shipped package is type checked — core, Django integration,
# SQLAlchemy and observability alike. Nothing under ``auditrum/`` is
# excluded, so the ``py.typed`` marker we ship is backed by a gate that
# actually covers every module a user can import.
project-includes = ["auditrum"]
python-version = "3.11"
# ``strict`` adds the annotation-completeness checks on top of the default
# preset: an unannotated parameter, a bare ``list`` / ``dict`` type argument
# or an untyped empty container is an error, not a silent ``Any``. That is
# what makes the ``py.typed`` marker meaningful — a downstream project type
# checking against auditrum gets real types, not ``Any`` bleeding out of our
# public surface.
preset = "strict"

[tool.pyrefly.errors]
# Auditrum interpolates identifiers and values into SQL. Several call sites
# coerce a parameter right before it reaches ``sql.Literal`` / a query
# parameter tuple (``sql.Literal(int(log_id))``, ``cur.execute(q, (table,
# str(object_id)))``). Pyrefly is correct that the annotation already says
# ``int`` / ``str`` — but an annotation is not a runtime guarantee, and these
# coercions are deliberate defence in depth on a SQL trust boundary. Keeping
# the rule off is cheaper and clearer than eight scattered suppressions.
unnecessary-type-conversion = false

# ``typing.override`` only exists from Python 3.12, and we support 3.11
# (see the version policy in ROADMAP). Satisfying this rule would mean
# taking a runtime dependency on ``typing_extensions`` for a decorator that
# buys us nothing the type checker isn't already verifying. Revisit when
# the supported floor moves to 3.12.
missing-override-decorator = false

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Default test discovery roots. Benchmarks live in a sibling tree and need
# the ``benchmark`` extras + container setup; keep them out of plain pytest.
testpaths = ["tests"]
# Prepend ``*`` to keep hypothesis' default ignores while adding our own.
norecursedirs = ["*", "benchmarks", ".venv", "build", "dist"]

[tool.coverage.run]
# Coverage scope mirrors the ty typing gate: core + Django integration.
source = ["auditrum"]
branch = true
omit = [
    "auditrum/integrations/sqlalchemy/*",
    "auditrum/observability/*",
    "*/migrations/*",
    "*/templates/*",
    "*/sql/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Initial floor matches the 0.4 baseline; raise to 90% by 0.7 RC.
fail_under = 80
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.$',
]

[tool.coverage.html]
directory = "htmlcov"
